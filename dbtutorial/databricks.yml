    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-7ecc0dbb-562f.cloud.databricks.com/
    
  prod:
    mode: production
    workspace:
      host: https://dbc-7ecc0dbb-562f.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/ajinkyamali50@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ajinkyamali50@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - user_name: ajinkyamali50@gmail.com
        level: CAN_MANAGE
