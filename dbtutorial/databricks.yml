bundle:
  name: dbtutorial
  uuid: 8d16ce01-425b-44bc-82b0-91f635df00d7

include:
  - resources/*.yml
  - resources/*/*.yml





targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
